plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.google.devtools.ksp"
    id "com.google.dagger.hilt.android"
}

android {
    namespace = "com.nuttavern"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.nuttavern"
        minSdk = 26
        targetSdk = 36
        versionCode = 26
        versionName = "1.0.25-internal"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        internal {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        production {
            def releaseStoreFile = System.getenv("NUT_TAVERN_KEYSTORE_FILE")
            def releaseStorePassword = System.getenv("NUT_TAVERN_KEYSTORE_PASSWORD")
            def releaseKeyAlias = System.getenv("NUT_TAVERN_KEY_ALIAS")
            def releaseKeyPassword = System.getenv("NUT_TAVERN_KEY_PASSWORD")
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        internal {
            initWith release
            matchingFallbacks = ["release"]
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.internal
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("NUT_TAVERN_KEYSTORE_FILE")) {
                signingConfig = signingConfigs.production
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/DEPENDENCIES"
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
        // AGP 8.7 lint crashes when it runs these newer AndroidX lint detectors.
        disable += [
            "AutoboxingStateValueProperty",
            "AutoboxingStateCreation",
            "CoroutineCreationDuringComposition",
            "FlowOperatorInvokedInComposition",
            "ComposableLambdaParameterNaming",
            "ComposableLambdaParameterPosition",
            "ComposableNaming",
            "StateFlowValueCalledInComposition",
            "CompositionLocalNaming",
            "FrequentlyChangingValue",
            "MutableCollectionMutableState",
            "ProduceStateDoesNotAssignValue",
            "RememberReturnType",
            "RememberInComposition",
            "OpaqueUnitKey",
            "UnrememberedMutableState",
            "NullSafeMutableLiveData",
        ]
    }
}

// Force consistent Kotlin stdlib version across all transitive dependencies
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:2.2.0"
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.05.01")
    implementation composeBom

    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.navigation:navigation-compose:2.8.5"

    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    implementation "com.google.dagger:hilt-android:2.56.2"
    ksp "com.google.dagger:hilt-android-compiler:2.56.2"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    implementation "androidx.datastore:datastore-preferences:1.1.1"

    implementation "androidx.room:room-runtime:2.7.2"
    implementation "androidx.room:room-ktx:2.7.2"
    ksp "androidx.room:room-compiler:2.7.2"

    implementation "com.google.code.gson:gson:2.12.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    // M3 种子色 → 完整 ColorScheme 的官方实现。Google 把 material-color-utilities 的源码
    // vendoring 到 com.google.android.material 库里(类路径 com.google.android.material.color.utilities.*),
    // 这是当前唯一通过 dl.google.com 稳定分发的官方渠道。仅为了拿到 Hct / SchemeTonalSpot /
    // MaterialDynamicColors,XML 视图组件不会被业务代码引用,release 构建会被 R8 摇掉。
    implementation "com.google.android.material:material:1.12.0"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-sse:4.12.0"

    // Markdown 渲染:assistant 消息 + reasoning 文本走真正的 markdown,user 气泡保持纯文本。
    // 解析层用 JetBrains 官方 markdown(纯 Kotlin,无 Compose 编译器版本耦合);
    // 渲染层在 ui/chat/markdown/ 自有实现,直接 AST → Compose,跳过 HTML 中间层。
    implementation "org.jetbrains:markdown:0.7.3"

    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // LazyColumn / LazyGrid 长按拖动排序。Compose 官方没出对应 API,社区 reorderable
    // 是当前最稳的实现,API 直接挂在 LazyColumn 上,不引入新的容器层。
    implementation "sh.calvin.reorderable:reorderable:2.4.3"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"

    // Icon libraries
    implementation "com.composables:icons-lucide:1.1.0"
    // AI provider logos via Coil SVG
    implementation "io.coil-kt.coil3:coil-svg:3.4.0"
    implementation "io.coil-kt.coil3:coil-compose:3.4.0"
}

